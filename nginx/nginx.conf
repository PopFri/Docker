events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    resolver 127.0.0.11 valid=10s;

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    server {
        listen 80;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://matomo:80;
        }

        location /js/ {
            alias /usr/share/nginx/html/js/;
        }

        location ~ /matomo.php$ {
            error_log /var/log/nginx/matomo_fluentd_error.log debug;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Popfri-IP $remote_addr;
            proxy_set_header X-Request-URI $request_uri;

            # 구성도 step 3: matomo로 프록시 (matomo.php 처리)
            proxy_pass http://matomo:80;

            # 구성도 step 4: 동시에 fluentd로 로그 전송 (mirror)
            mirror /mirror_fluentd;
            mirror_request_body on;
        }

        location = /mirror_fluentd {
            internal;
            proxy_pass http://fluentd:9880/matomo.php;
            proxy_set_header Popfri-IP $remote_addr;
            proxy_set_header X-Request-URI $request_uri;
        }
    }
}